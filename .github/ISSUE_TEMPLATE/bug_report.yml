name: 缺陷报告
description: 报告可公开讨论、能够复现的问题
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。安全漏洞请按 SECURITY.md 私密报告，不要在这里公开 Cookie、验证码、邀请码、数据库、邮箱、服务器地址或账号凭据。
  - type: input
    id: version
    attributes:
      label: 项目版本
      description: 请填写版本号、Release 名称或提交编号。
      placeholder: 例如 0.1.0
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: 部署场景
      options:
        - 个人电脑，仅本机访问
        - 个人电脑，局域网访问
        - 软路由、NAS 或家庭小主机
        - 私有服务器、内网域名或 VPN
        - 公网服务器、域名与 HTTPS
        - 其他
    validations:
      required: true
  - type: dropdown
    id: architecture
    attributes:
      label: CPU 架构
      options:
        - linux/amd64
        - linux/arm64
        - 其他或不确定
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 运行环境
      description: 请填写操作系统、Docker、Compose、浏览器和反向代理版本。
      placeholder: Windows 11 + Docker Desktop；或 Debian 13 + Docker Engine
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请提供可以稳定重现问题的最小步骤。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果与脱敏日志
      description: 只粘贴必要内容，并删除所有个人信息和凭据。
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue，没有发现同一问题。
          required: true
        - label: 我已确认内容不含 Cookie、验证码、邀请码、数据库、邮箱、服务器地址或账号凭据。
          required: true
        - label: 我操作的是本人拥有或已获明确授权的账号。
          required: true
