name: spark-keeper

services:
  gateway:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - '${SPARK_BIND_ADDRESS:-127.0.0.1}:${SPARK_PORT:-3000}:80'
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      frontend:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1/api/health']
      interval: 20s
      timeout: 8s
      retries: 5
      start_period: 10s
    logging:
      options:
        max-size: '10m'
        max-file: '3'

  frontend:
    build:
      context: .
      args:
        NEXT_PUBLIC_ICP_NUMBER: ${NEXT_PUBLIC_ICP_NUMBER:-}
        NEXT_PUBLIC_PUBLIC_SECURITY_NUMBER: ${NEXT_PUBLIC_PUBLIC_SECURITY_NUMBER:-}
    restart: unless-stopped
    expose:
      - '3000'
    mem_limit: 260m
    memswap_limit: 260m
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '-q',
          '--spider',
          'http://127.0.0.1:3000/',
        ]
      interval: 20s
      timeout: 8s
      retries: 5
      start_period: 30s
    logging:
      options:
        max-size: '10m'
        max-file: '3'

  api:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    command:
      [
        'uvicorn',
        'app.main:app',
        '--host',
        '0.0.0.0',
        '--port',
        '8000',
        '--workers',
        '1',
        '--proxy-headers',
      ]
    expose:
      - '8000'
    volumes:
      - spark_data:/app/data
    mem_limit: 300m
    memswap_limit: 300m
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)",
        ]
      interval: 20s
      timeout: 8s
      retries: 5
      start_period: 20s
    logging:
      options:
        max-size: '10m'
        max-file: '3'

  worker:
    build: ./backend
    init: true
    restart: unless-stopped
    env_file: .env
    environment:
      SPARK_RECYCLE_AFTER_RUN: ${SPARK_RECYCLE_AFTER_RUN:-1}
    command: ['python', '-m', 'app.worker']
    volumes:
      - spark_data:/app/data
    mem_limit: 1024m
    memswap_limit: 1024m
    shm_size: 192m
    depends_on:
      api:
        condition: service_healthy
    logging:
      options:
        max-size: '20m'
        max-file: '3'

  mailer:
    profiles: ['mail']
    build: ./backend
    restart: unless-stopped
    env_file: .env
    command: ['python', '-m', 'app.mail_worker']
    volumes:
      - spark_data:/app/data
    mem_limit: 180m
    depends_on:
      api:
        condition: service_healthy
    logging:
      options:
        max-size: '10m'
        max-file: '3'

volumes:
  spark_data:
